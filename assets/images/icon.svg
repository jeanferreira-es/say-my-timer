<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#03314A"/>
      <stop offset="1" stop-color="#00131D"/>
    </radialGradient>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- Stopwatch that is also a speech bubble: "say" + "timer" -->
  <g id="mark" transform="translate(0 -25)">
    <!-- crown -->
    <rect x="484" y="214" width="56" height="70" fill="#FFFFFF"/>
    <rect x="428" y="170" width="168" height="62" rx="31" fill="#FFFFFF"/>
    <!-- side button -->
    <rect x="703" y="300" width="84" height="48" rx="20" fill="#DE2C6E" transform="rotate(45 745 324)"/>

    <!-- bubble body + tail -->
    <circle cx="512" cy="548" r="290" fill="#FFFFFF"/>
    <path d="M300 700 L216 896 L424 806 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>

    <!-- dial -->
    <circle cx="512" cy="548" r="236" fill="#00131D"/>
    <circle cx="512" cy="548" r="182" fill="none" stroke="#00AAB7" stroke-width="44"/>
    <path d="M512 366 A182 182 0 0 1 669.6 639" fill="none" stroke="#DE2C6E" stroke-width="44" stroke-linecap="round"/>

    <!-- hand -->
    <line x1="512" y1="548" x2="623" y2="612" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
    <circle cx="512" cy="548" r="34" fill="#FFFFFF"/>
    <circle cx="512" cy="548" r="13" fill="#DE2C6E"/>
  </g>
</svg>
